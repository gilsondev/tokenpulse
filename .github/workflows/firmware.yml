# Compila o firmware das placas em todo push e PR. No push no main, os commits desde a última tag decidem a
# versão pelo Conventional Commits (.github/scripts/next_version.py): feat sobe a minor, fix e perf a patch, ! ou
# BREAKING CHANGE a major, e o resto não gera release. Havendo versão, o firmware sai com ela e o release é
# publicado com, por placa, o .bin de OTA e a imagem completa para a primeira gravação pela USB. Uma tag v*
# empurrada à mão também publica.
name: firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# um release por vez: dois pushes seguidos não calculam a mesma versão
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # o histórico e as tags inteiros: a versão sai dos commits desde a última tag
      - run: python3 .github/scripts/next_version.py --test
      - id: next
        run: |
          python3 .github/scripts/next_version.py | tee -a "$GITHUB_OUTPUT"

  # o daemon e o instalador: testes, erros de Python (ruff, só as regras de erro real) e sintaxe dos scripts.
  # Falhou aqui, não sai firmware nem release.
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with pytest --with pyserial --with bleak pytest host/tests -q
      - run: uvx ruff check --select F host/ .github/scripts/
      - run: for f in docs/install.sh host/install.sh host/statusline.sh setup.sh update.sh firmware/flash.sh; do bash -n "$f"; done

  build:
    needs: [version, daemon]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:  # o ESP32 clássico tem o bootloader em 0x1000; o S3, em 0x0
          - {board: guition-jc3248w535, chip: esp32s3, boot: "0x0"}
          - {board: waveshare-s3-lcd-147b, chip: esp32s3, boot: "0x0"}
          - {board: waveshare-amoled-216, chip: esp32s3, boot: "0x0"}
          - {board: cyd-2432s028r, chip: esp32, boot: "0x1000"}
          - {board: smalltv-ultra, chip: esp8266}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Compilar
        working-directory: firmware
        env:
          # a versão aparece no Sobre e no handshake com o daemon: a tag no release, o commit no resto
          PLATFORMIO_BUILD_FLAGS: '-DFW_VERSION=\"${{ needs.version.outputs.tag || github.sha }}\"'
        run: pio run -e ${{ matrix.board }}
      - name: Imagem completa (bootloader + partições + app)
        if: matrix.chip != 'esp8266'
        working-directory: firmware
        run: |
          B=.pio/build/${{ matrix.board }}
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip ${{ matrix.chip }} merge_bin -o "$B/factory.bin" \
            ${{ matrix.boot }} "$B/bootloader.bin" 0x8000 "$B/partitions.bin" \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 "$B/firmware.bin"
          mkdir -p ../dist
          cp "$B/firmware.bin" "../dist/tokenpulse-${{ matrix.board }}-ota.bin"
          cp "$B/factory.bin" "../dist/tokenpulse-${{ matrix.board }}-factory.bin"
      - name: Imagem do ESP8266 (o firmware.bin já traz o bootloader; a placa só se grava pelo WiFi)
        if: matrix.chip == 'esp8266'
        working-directory: firmware
        run: |
          mkdir -p ../dist
          cp .pio/build/${{ matrix.board }}/firmware.bin "../dist/tokenpulse-${{ matrix.board }}-ota.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: dist/*

  release:
    if: needs.version.outputs.tag != ''
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # as notas saem dos commits desde a tag anterior
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar o release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # --target cria a tag no commit deste build quando ela ainda não existe (release automático).
          # Tag criada pelo GITHUB_TOKEN não dispara outro workflow, então não há build repetido.
          python3 .github/scripts/next_version.py --notes "$TAG" > notes.md
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "$TAG" --notes-file notes.md

  # o site serve a imagem nova para a gravação pelo navegador; o release criado pelo GITHUB_TOKEN não
  # dispara outro workflow, então o Pages é chamado daqui
  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
