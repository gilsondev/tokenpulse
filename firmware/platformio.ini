; Um env por placa. O nome do env é o board::NAME da placa: o daemon usa para achar o .bin do OTA.
; Placa nova: crie src/boards/<placa>.h, inclua em board.h e acrescente um env abaixo.

[platformio]
default_envs = guition-jc3248w535

[env]
platform = espressif32@6.9.0
framework = arduino
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -fno-math-errno
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    bblanchon/ArduinoJson@7.2.1
monitor_speed = 115200
build_src_filter = +<*> -<smalltv/>
extra_scripts = pre:tools/version.py  ; build local sai com o git describe; o CI passa a tag

[env:waveshare-s3-lcd-147b]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_WAVESHARE_S3_LCD_147B
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:guition-jc3248w535]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino@1.4.9
build_flags =
    ${env.build_flags}
    -DBOARD_GUITION_JC3248W535
    -DESP32QSPI_MAX_PIXELS_AT_ONCE=10240
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:cyd-2432s028r]
board = esp32dev
board_build.partitions = min_spiffs.csv
upload_speed = 460800
monitor_speed = 460800
build_flags =
    ${env.build_flags}
    -DBOARD_CYD_2432S028R

; GeekMagic SmallTV-Ultra: ESP8266 sem USB de dados. Versão mínima à parte (src/smalltv/): só a tela
; principal, dados e OTA pelo WiFi. O layout 4m2m deixa espaço para o OTA de uma imagem até 1 MB.
[env:smalltv-ultra]
platform = espressif8266@4.2.1
board = esp12e
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.4m2m.ld
build_src_filter = -<*> +<smalltv/>
build_flags =
    ${env.build_flags}
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
